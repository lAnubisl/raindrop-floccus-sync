services:
  raindrop-to-floccus:
    build:
      context: .
    restart: unless-stopped
    environment:
      GIT_REPOSITORY_URL: git@gitea:account/repository.git
      GIT_SSH_PRIVATE_KEY: |
        -----BEGIN OPENSSH PRIVATE KEY-----
        ...................................
        -----END OPENSSH PRIVATE KEY-----
      RAINDROP_API_TOKEN: xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      RAINDROP_REQUEST_TIMEOUT: 00:00:30
      GIT_AUTHOR_NAME: raindrop-floccus
      GIT_AUTHOR_EMAIL: user@example.com
      GIT_WORKING_DIRECTORY: /var/lib/raindrop-to-floccus/repository
      SYNC_INTERVAL: 01:00:00
      RETRY_INTERVAL: 00:05:00
      MAX_RETRY_ATTEMPTS: 5
      LOG_LEVEL: Information
      HEALTH_PORT: 8080
    volumes:
      - repository-work:/var/lib/raindrop-to-floccus
    networks:
      - gitea-network

volumes:
  repository-work:

networks:
  gitea-network:
    external: true
